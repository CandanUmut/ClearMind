<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ClearMind</title>
    <script>
      // GitHub Pages SPA fallback: redirect any deep link back to the app root.
      // ClearMind uses in-app view state (no router), so the root is always correct.
      var base = '/clearmind/';
      window.location.replace(base + window.location.search + window.location.hash);
    </script>
  </head>
  <body></body>
</html>
